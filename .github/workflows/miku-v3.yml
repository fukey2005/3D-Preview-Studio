name: Miku creator download completion
on:
  push:
    branches: ["benchmark/miku-v3-20260925"]
concurrency:
  group: miku-v3
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Save the original browser download
        run: |
          mkdir -p model-resource
          cat > get-model.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const ctx=await browser.newContext({acceptDownloads:true});const p=await ctx.newPage();const log=[];
          p.on('response',r=>{if(r.url().includes('download')||r.url().includes('storage-file'))log.push({url:r.url(),status:r.status(),headers:r.headers()});});
          try{
           await p.goto('https://bowlroll.net/file/146088',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3000);
           const promise=p.waitForEvent('download',{timeout:120000});
           await p.locator('#file-show-download button[type=submit]').click();
           const file=await promise;console.log('DOWNLOAD',file.suggestedFilename());await file.saveAs('model-resource/Tda-V4X.zip');
           const bytes=await fs.readFile('model-resource/Tda-V4X.zip');console.log('SAVED',bytes.length);if(bytes[0]!==80||bytes[1]!==75)throw Error('Not a ZIP');
           await fs.writeFile('model-resource/source.json',JSON.stringify({creator:'Tda',source:'https://bowlroll.net/file/146088',filename:file.suggestedFilename(),bytes:bytes.length},null,2));
          }catch(e){console.log(e);await fs.writeFile('model-resource/error.html',await p.content());await p.screenshot({path:'model-resource/error.png'});process.exitCode=1;}
          await fs.writeFile('model-resource/requests.json',JSON.stringify(log,null,2));await browser.close();
          JS
          node get-model.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miku-creator-model-complete
          path: model-resource/
          retention-days: 7
