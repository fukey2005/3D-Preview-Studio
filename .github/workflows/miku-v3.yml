name: Miku creator model retrieval
on:
  push:
    branches: ["benchmark/miku-v3-20260925"]
concurrency:
  group: miku-v3
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Follow successful public download form
        run: |
          mkdir -p model-resource
          cat > get-model.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs/promises';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const ctx=await browser.newContext({acceptDownloads:true});const p=await ctx.newPage();
          await p.goto('https://bowlroll.net/file/146088',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(3000);
          const check=p.waitForResponse(r=>r.url().includes('/146088/download-check'),{timeout:30000});
          await p.locator('#file-show-download button[type=submit]').click();
          const r=await check;const payload=await r.json();console.log(JSON.stringify(payload));
          if(payload.status!=='success'||!payload.url)throw Error('Creator download not publicly authorized');
          const download=await ctx.request.get(payload.url,{timeout:90000});console.log('DOWNLOAD',download.status(),download.headers());
          const bytes=await download.body();await fs.writeFile('model-resource/Tda-V4X.zip',bytes);console.log('BYTES',bytes.length);
          if(bytes[0]!==80||bytes[1]!==75)throw Error('Not a ZIP archive');
          await fs.writeFile('model-resource/source.json',JSON.stringify({creator:'Tda',source:'https://bowlroll.net/file/146088',bytes:bytes.length,date:new Date().toISOString()},null,2));
          await browser.close();
          JS
          node get-model.mjs
          python3 - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('model-resource/Tda-V4X.zip')
          print(z.namelist())
          for i in z.infolist():
            if i.filename.lower().endswith('.txt'):
              data=z.read(i)
              for enc in ['utf-8-sig','cp932']:
                try: txt=data.decode(enc);break
                except UnicodeError:pass
              else:txt=data.decode('utf-8',errors='replace')
              print(i.filename,txt)
              pathlib.Path('model-resource/'+str(i.header_offset)+'-readme.txt').write_text(txt)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miku-creator-model
          path: model-resource/
          retention-days: 7
