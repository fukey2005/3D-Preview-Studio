name: Miku v3 final render and acceptance
on:
  push:
    branches: ["benchmark/miku-v3-20260925"]
    paths: [".github/workflows/miku-v3.yml", "v3-fix.py", "capture-v3-demo.mjs"]
concurrency:
  group: miku-v3
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/download-artifact@v4
        with:
          name: miku-v3-preview-10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: fukey2005/3D-Preview-Studio
          run-id: 36129382947
          path: .base
      - name: Restore tested v3 source and edited GLB
        run: |
          tar -xzf .base/v3-source.tgz
          python3 v3-fix.py
          cp capture-v3-demo.mjs tests/capture-v3-demo.mjs
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Install video encoder
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render all seventeen artworks and six videos, then test actual WebGL
        env:
          RENDER_MOTION: '1'
          EVIDENCE_DIR: evidence-v3
        run: node tests/verify.mjs
        timeout-minutes: 23
      - name: Capture desktop and mobile facial poses
        if: always()
        run: node tests/v3-preview.mjs
        timeout-minutes: 3
      - name: Record actual scroll expression sequence
        if: always()
        run: node tests/capture-v3-demo.mjs
        timeout-minutes: 4
      - name: Export revised source and built website
        if: always()
        run: tar -czf v3-source.tgz src public tests scripts package.json package-lock.json astro.config.mjs tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miku-v3-final-${{ github.run_number }}
          path: |
            evidence-v3/
            evidence-v3-preview/
            dist/
            v3-source.tgz
          retention-days: 7
