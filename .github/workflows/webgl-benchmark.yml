name: Isolated public WebGL benchmark
on:
  push:
    branches: ["benchmark/webgl-20260925"]
concurrency:
  group: miku-reference-benchmark
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: node capture-hero.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-reference-${{ github.run_number }}
          path: reference/
          retention-days: 1
