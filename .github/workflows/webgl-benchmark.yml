name: Miku final acceptance
on:
  push:
    branches: ["benchmark/webgl-20260925"]
concurrency:
  group: miku-reference-benchmark
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: miku-ready-10
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: fukey2005/3D-Preview-Studio
          run-id: 36121972385
          path: .recovered
      - name: Restore built assets and synchronize navigation
        run: |
          tar -xzf .recovered/verified-source.tgz
          python3 finish-navigation.py
      - run: npm ci --no-fund --no-audit
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Actual browser acceptance tests
        env:
          SKIP_ART: '1'
          EVIDENCE_DIR: evidence-final
        run: node tests/verify.mjs
        timeout-minutes: 10
      - name: Export tested source
        if: always()
        run: tar -czf verified-source.tgz src public tests package.json package-lock.json astro.config.mjs tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miku-release-${{ github.run_number }}
          path: |
            evidence-final/
            dist/
            verified-source.tgz
          retention-days: 7
