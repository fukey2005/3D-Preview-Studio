name: Miku acceptance and distributable build
on:
  push:
    branches: ["benchmark/webgl-20260925"]
concurrency:
  group: miku-reference-benchmark
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: miku-final-8
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: fukey2005/3D-Preview-Studio
          run-id: 36120203945
          path: .recovered
      - name: Restore fully rendered assets and apply acceptance fixes
        run: |
          tar -xzf .recovered/verified-source.tgz
          python3 acceptance-finish.py
      - run: npm ci --no-fund --no-audit
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - name: Encode compatible WebM alternatives without rerendering geometry
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          for film in public/motion/*.mp4; do
            ffmpeg -v error -y -i "$film" -c:v libvpx-vp9 -b:v 0 -crf 28 -deadline good -cpu-used 4 -an "${film%.mp4}.webm"
          done
      - name: Actual browser acceptance tests
        env:
          SKIP_ART: '1'
          EVIDENCE_DIR: evidence-final
        run: node tests/verify.mjs
        timeout-minutes: 10
      - name: Export tested source
        if: always()
        run: tar -czf verified-source.tgz src public tests package.json package-lock.json astro.config.mjs tsconfig.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miku-ready-${{ github.run_number }}
          path: |
            evidence-final/
            dist/
            verified-source.tgz
          retention-days: 7
