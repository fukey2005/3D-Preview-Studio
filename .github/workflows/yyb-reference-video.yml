name: Public YYB availability and continuous reference video
on:
  push:
    branches: ['benchmark/yyb-video-20260927']
    paths: ['.github/workflows/yyb-reference-video.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: mkdir -p .video-inspection && cd .video-inspection && npm init -y && npm install playwright@1.52.0 && npx playwright install --with-deps chromium
      - name: Inspect only official public model endpoints, without bypassing authentication
        run: |
          mkdir -p yyb-reference
          python3 - <<'PY'
          import urllib.request,json
          from pathlib import Path
          uid='42e65e775d6646db8ab45c7fc28588a0'
          result={}
          for name,url in [('model','https://api.sketchfab.com/v3/models/'+uid),('download','https://api.sketchfab.com/v3/models/'+uid+'/download')]:
            try:
              r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25)
              text=r.read().decode();result[name]={'url':url,'status':r.status,'body':text}
            except urllib.error.HTTPError as e:result[name]={'url':url,'status':e.code,'body':e.read().decode()[:2000]}
            except Exception as e:result[name]={'url':url,'error':str(e)}
          Path('yyb-reference/model-access.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False)[:18000])
          PY
      - name: Record real continuous browser scrolling, reverse scrolling and page navigation
        run: |
          cat > .video-inspection/capture.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs/promises';
          const out='../yyb-reference';const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          const timeline=[];const cues=[[0,0],[7,0],[12,.05],[28,.30],[31,.30],[38,.405],[43,.47],[51,.57],[62,.64],[78,.87],[85,.94],[90,1],[95,1],[109,.43],[120,0]];
          for(const [device,w,h] of [['desktop',1280,800],['mobile',390,844]]){
            const ctx=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1,recordVideo:{dir:out+'/recordings',size:{width:w,height:h}}});
            const p=await ctx.newPage();const vid=p.video();const info={device,cues,viewport:[w,h],events:[],errors:[]};timeline.push(info);p.on('pageerror',e=>info.errors.push(String(e)));
            try{
              const t=Date.now();await p.goto('https://alche.studio/',{waitUntil:'domcontentloaded',timeout:90000});info.events.push({time:Date.now()-t,event:'domcontentloaded'});
              await p.waitForFunction(()=>{const e=document.getElementById('loading-overlay');return !e||getComputedStyle(e).display==='none'||Number(getComputedStyle(e).opacity)<.01},null,{timeout:100000});
              const decline=p.locator('[data-sound-intro-decline]');if(await decline.count())await decline.click({force:true}).catch(()=>{});
              await p.waitForTimeout(1500);const max=await p.evaluate(()=>document.documentElement.scrollHeight-innerHeight);info.height=max+h;info.scrollRecordingStartsMs=Date.now()-t;
              await p.evaluate(({cues,max})=>{window.__REFERENCE_CAPTURE={samples:[],done:false};const start=performance.now();function frame(now){const seconds=(now-start)/1000;let index=1;while(index<cues.length-1&&seconds>cues[index][0])index++;const a=cues[index-1],b=cues[index],u=Math.max(0,Math.min(1,(seconds-a[0])/(b[0]-a[0]))),ease=u*u*u*(10+u*(-15+6*u));scrollTo(0,(a[1]+(b[1]-a[1])*ease)*max);const last=window.__REFERENCE_CAPTURE.samples.at(-1);if(!last||seconds-last.t>.2)window.__REFERENCE_CAPTURE.samples.push({t:seconds,scroll:scrollY});if(seconds<cues.at(-1)[0])requestAnimationFrame(frame);else window.__REFERENCE_CAPTURE.done=true;}requestAnimationFrame(frame);},{cues,max});
              await p.waitForFunction(()=>window.__REFERENCE_CAPTURE.done,null,{timeout:140000});info.samples=await p.evaluate(()=>window.__REFERENCE_CAPTURE.samples);info.events.push({time:Date.now()-t,event:'forward-and-reverse-complete'});
              const works=p.locator('header a[href="/works/"]').first();if(await works.count()){await works.click();await p.waitForTimeout(4000);info.events.push({time:Date.now()-t,event:'works-open',url:p.url()});await p.mouse.wheel(0,700);await p.waitForTimeout(2000);await p.goBack();await p.waitForTimeout(4000);info.events.push({time:Date.now()-t,event:'back-home',url:p.url()});}
              await fs.writeFile(out+'/'+device+'-dom.html',await p.content());
            }catch(e){info.failure=String(e);console.error(device,e);}finally{await ctx.close();await vid.saveAs(out+'/alche-'+device+'-continuous.webm');}
          }
          const ctx=await browser.newContext({viewport:{width:1280,height:800}});const p=await ctx.newPage();try{await p.goto('https://sketchfab.com/3d-models/yyb-42e65e775d6646db8ab45c7fc28588a0',{waitUntil:'domcontentloaded',timeout:60000});await p.waitForTimeout(5000);await fs.writeFile(out+'/sketchfab-page.txt',await p.locator('body').innerText());const d=p.getByText('Download 3D Model',{exact:true}).first();if(await d.count()){await d.click();await p.waitForTimeout(2000);await fs.writeFile(out+'/sketchfab-download-dialog.txt',await p.locator('body').innerText());}}catch(e){await fs.writeFile(out+'/sketchfab-error.txt',String(e));}await ctx.close();await fs.writeFile(out+'/timeline.json',JSON.stringify({recording:'Actual continuous Playwright video at wall-clock speed; scripted normalized scroll positions, no per-section still-image montage',timeline},null,2));await browser.close();
          JS
          cd .video-inspection && node capture.mjs
        timeout-minutes: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yyb-public-reference-video
          path: yyb-reference/
          retention-days: 3
